services:
  db:
    image: postgres:16
    container_name: trading-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  dbdata: