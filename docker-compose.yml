services:
  db:
    image: postgres:16
    container_name: trading-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Bot dos 5 mercados (Alpaca PAPER). Substitui o antigo bot da Binance.
  botmulti:
    build: .
    container_name: trading-botmulti
    restart: unless-stopped
    depends_on:
      - db
    command: ["java", "-cp", "/app/app.jar:/app/libs/*", "BotMulti"]
    environment:
      ALPACA_KEY: ${ALPACA_KEY}
      ALPACA_SECRET: ${ALPACA_SECRET}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_URL: jdbc:postgresql://db:5432/trading
    volumes:
      - botmultidata:/data

  grafana:
    image: grafana/grafana:11.2.0
    container_name: trading-grafana
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafanadata:/var/lib/grafana

volumes:
  dbdata:
  botmultidata:
  grafanadata: